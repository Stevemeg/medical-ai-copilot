services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_phase5}
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development_only_change_me}
    ports:
      - "55432:5432"
    volumes:
      - medical_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d ${POSTGRES_DB:-medical_phase5}"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &api_environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://medical:${POSTGRES_PASSWORD:-development_only_change_me}@postgres:5432/${POSTGRES_DB:-medical_phase5}
      AUTH_MODE: dev
      DEV_JWT_KEY: ${DEV_JWT_KEY:-replace-with-a-random-development-only-key-at-least-32-characters}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-replace-with-a-different-random-key-at-least-32-characters}
      CORS_ORIGINS: '["http://localhost:5500","http://localhost:18000","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    ports:
      - "18000:8000"
    environment: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
volumes:
  medical_postgres:
