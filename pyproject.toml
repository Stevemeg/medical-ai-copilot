[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["backend/knowledge_models.py", "backend/source_registry.py", "backend/index_provenance.py", "backend/ingestion.py"]
ignore_missing_imports = true
