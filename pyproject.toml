[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["backend/knowledge_models.py", "backend/source_registry.py", "backend/index_provenance.py", "backend/ingestion.py", "backend/patient_models.py", "backend/fhir_adapter.py", "backend/patient_context.py", "backend/patient_store.py", "backend/patient_api.py", "backend/clinical_models.py", "backend/clinical_rules.py", "backend/clinical_review.py", "backend/rule_evidence.py", "scripts/verify_rule_evidence.py", "backend/evidence_models.py", "backend/evidence_pipeline.py", "backend/generator.py", "backend/grounding.py", "backend/conflicts.py", "backend/rag_pipeline.py", "embeddings/retrieve.py", "embeddings/reranker.py", "embeddings/recommendation_extractor.py"]
ignore_missing_imports = true
